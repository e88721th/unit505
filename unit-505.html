<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>陳樵國語文</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .option-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 0.5rem; font-size: 0.9rem; min-height: 40px; display: flex; align-items: center; }
    .option-btn:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .confetti { 
      position: absolute; 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      animation: fall 1.8s linear forwards; 
      top: -20px; 
      pointer-events: none;
    }
    @keyframes fall { 
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      50% { transform: translateY(300px) rotate(360deg); }
      100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
    }
    #quiz-container { max-height: 80vh; overflow-y: auto; padding: 1rem; }
    .disabled-btn { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-rose-50 min-h-screen pb-12">
  <div class="max-w-2xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <!-- 標題部分：將圖示單獨包裝以放大，文字保持 text-3xl -->
      <div class="flex items-center gap-2">
        <span class="text-5xl">🎓</span>
        <h3 class="text-3xl font-bold text-indigo-700">小五-單元5-成語</h3>
      </div>
      <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-full text-sm font-bold text-gray-700 transition">返回</button>
    </div>
    <div id="quiz-container" class="bg-white rounded-3xl shadow-2xl p-5 min-h-[520px]"></div>
  </div>

  <script>
    const DEBUG = true;
    const TIME_LIMIT = 60;
    let allQuestions = [], questions = [], wrongQuestions = [], current = 0, score = 0;
    let timerInterval, timeLeft = TIME_LIMIT;
    let username = '', currentUnit = '';
    let isTimeout = false;
    let currentShuffled = [];
    let currentOriginalToNew = {};

    async function loadQuestions() {
      try {
        const res = await fetch('unit-505成語.json');
        allQuestions = await res.json();
        showWelcomeScreen();
      } catch (e) {
        document.getElementById('quiz-container').innerHTML = `<div class="text-center py-20 text-red-600">❌ 無法載入題目，請確認 JSON 檔案存在</div>`;
      }
    }

    function showWelcomeScreen() {
      document.getElementById('quiz-container').innerHTML = `
        <div class="text-center py-16">
          <div class="text-7xl mb-6">📝</div>
          <h3 class="text-4xl font-bold text-indigo-700 mb-3">熟能生巧練功坊</h3>
          <button onclick="showUnitSelection()" class="w-64 py-5 bg-indigo-600 text-white text-2xl font-medium rounded-3xl shadow-xl">進入</button>
        </div>
      `;
    }

    function showUnitSelection() {
      let html = `<div class="text-center py-8"><h2 class="text-3xl font-bold mb-8">請選擇測驗關卡</h2>
        <div class="grid grid-cols-5 gap-3 mb-6">` + 
        [1,2,3].map(i => `<button onclick="startUnit(${i})" class="py-5 bg-white border rounded-2xl font-medium hover:bg-indigo-50">關卡 ${i}</button>`).join('') + 
        `</div><button onclick="startAllUnits()" class="w-full py-5 bg-amber-400 text-white text-xl font-medium rounded-3xl">📚 全部混合</button></div>`;
      document.getElementById('quiz-container').innerHTML = html;
    }

    function startUnit(u) { questions = shuffle(allQuestions.filter(q => q.unit === u)); currentUnit = u; resetQuiz(); }
    function startAllUnits() { questions = shuffle([...allQuestions]); currentUnit = '全'; resetQuiz(); }
    function resetQuiz() { current = 0; score = 0; wrongQuestions = []; isTimeout = false; loadQuestion(); }
    function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

    function adjustExplanation(explanation, originalToNew) {
      return explanation.replace(/選項([A-D])/g, (match, letter) => {
        const originalIdx = letter.charCodeAt(0) - 65;
        const newIdx = originalToNew[originalIdx];
        return newIdx !== undefined ? '選項' + String.fromCharCode(65 + newIdx) : match;
      });
    }

    function loadQuestion() {
      const q = questions[current];
      if (typeof q.answer !== 'number') { q.answer = parseInt(q.answer, 10) || 0; }
      const shuffledOptions = shuffle([...q.options]);
      const correctIndex = shuffledOptions.indexOf(q.options[q.answer]);
      const originalToNew = {};
      q.options.forEach((opt, idx) => { originalToNew[idx] = shuffledOptions.indexOf(opt); });
      currentShuffled = shuffledOptions;
      currentOriginalToNew = originalToNew;

      document.getElementById('quiz-container').innerHTML = `
        <div class="flex justify-between mb-6 text-sm font-medium">
          <span>關卡 ${q.unit} • 第 <span id="q-number">${current+1}</span> / ${questions.length}</span>
          <span id="timer" class="font-mono text-orange-600">${TIME_LIMIT}</span>
        </div>
        <div class="text-2xl font-medium mb-6">${current + 1}. ${q.question}</div>
        <div class="grid gap-2">${shuffledOptions.map((o,i) => `
          <button onclick="selectOption(${i}, ${correctIndex}, '${q.explanation}')" 
                  class="option-btn bg-gray-50 border rounded-3xl text-2xl">
            ${String.fromCharCode(65+i)}. ${o}
          </button>`).join('')}
        </div>
        <div id="feedback" class="mt-4 hidden"></div>
      `;
      isTimeout = false;
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_LIMIT;
      const timerEl = document.getElementById('timer');
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timerEl) { timerEl.textContent = timeLeft; if (timeLeft <= 10) timerEl.classList.add('text-red-600'); }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!isTimeout) {
            isTimeout = true;
            wrongQuestions.push(questions[current]);
            const q = questions[current];
            const adjustedExp = adjustExplanation(q.explanation, currentOriginalToNew);
            document.getElementById('feedback').innerHTML = `<div class="p-4 rounded-3xl bg-red-100">⏰ 時間到！正確答案：${q.options[q.answer]}<br>${adjustedExp}</div>
                <button onclick="nextQuestion()" class="mt-4 w-full py-4 bg-indigo-600 text-white rounded-3xl">下一題</button>`;
            document.getElementById('feedback').classList.remove('hidden');
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled-btn'));
          }
        }
      }, 1000);
    }

    window.selectOption = function(selectedIdx, correctIdx, rawExplanation) {
      if (isTimeout) return;
      clearInterval(timerInterval);
      const isCorrect = (selectedIdx === correctIdx);
      const adjustedExp = adjustExplanation(rawExplanation, currentOriginalToNew);
      
      if (isCorrect) { 
        score++; 
        playSound(true);
        createConfetti();
      } else { 
        wrongQuestions.push(questions[current]); 
        playSound(false);
      }
      
      const feedback = document.getElementById('feedback');
      feedback.innerHTML = `<div class="p-4 rounded-3xl ${isCorrect?'bg-green-100':'bg-red-100'}">
          ${isCorrect ? '🎉 答對！' : '😔 答錯'} - ${adjustedExp}</div>
          <button onclick="nextQuestion()" class="mt-4 w-full py-4 bg-indigo-600 text-white rounded-3xl">
            ${current < questions.length-1 ? '下一題' : '查看成績'}
          </button>`;
      feedback.classList.remove('hidden');
      document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled-btn'));
    };

    function playSound(isCorrect) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isCorrect ? 'sine' : 'sawtooth';
        osc.frequency.setValueAtTime(isCorrect ? 880 : 420, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (isCorrect ? 0.55 : 0.8));
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + (isCorrect ? 0.6 : 0.9));
      } catch(e) {}
    }

    function createConfetti() {
      for (let i = 0; i < 120; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.backgroundColor = ['#6366f1','#a855f7','#ec4899','#eab308','#22c55e'][Math.floor(Math.random()*5)];
        c.style.animationDuration = (Math.random() * 1.2 + 1.3) + 's';
        c.style.opacity = Math.random() * 0.7 + 0.6;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2800);
      }
    }

    window.nextQuestion = function() { current++; current < questions.length ? loadQuestion() : showResult(); };

    function showResult() {
      const pct = Math.round((score / questions.length) * 100);
      const scores = JSON.parse(localStorage.getItem('idiomHighScores') || '[]');
      scores.push({ score: pct, unit: currentUnit || '全', date: new Date().toLocaleDateString() });
      localStorage.setItem('idiomHighScores', JSON.stringify(scores.sort((a,b) => b.score - a.score)));
      
      document.getElementById('quiz-container').innerHTML = `
        <div class="text-center py-12">
          <h2 class="text-4xl font-bold mb-4">${pct}% 正確率</h2>
          <div class="grid grid-cols-2 gap-3">
            ${wrongQuestions.length > 0 ? `<button onclick="startReview()" class="py-4 bg-orange-500 text-white rounded-3xl">重練錯題 (${wrongQuestions.length})</button>` : ''}
            <button onclick="location.reload()" class="py-4 bg-indigo-600 text-white rounded-3xl">回到首頁</button>
            <button onclick="showLeaderboard()" class="py-4 bg-green-600 text-white rounded-3xl">成績</button>
            <button onclick="showUnitSelection()" class="py-4 bg-blue-600 text-white rounded-3xl">選單元</button>
          </div>
        </div>`;
    }

    window.startReview = function() { questions = shuffle([...wrongQuestions]); current = 0; score = 0; wrongQuestions = []; isTimeout = false; loadQuestion(); };

    window.showLeaderboard = function() {
      const s = JSON.parse(localStorage.getItem('idiomHighScores') || '[]');
      document.getElementById('quiz-container').innerHTML = `
        <h2 class="text-2xl font-bold mb-4">🏆 成績榜</h2>
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b-2 border-gray-300 text-gray-600">
              <th class="py-2">名次</th>
              <th class="py-2">單元</th>
              <th class="py-2">正確率</th>
              <th class="py-2">日期</th>
            </tr>
          </thead>
          <tbody>
            ${s.map((x,i) => `
              <tr class="border-b">
                <td class="py-2">${i+1}</td>
                <td class="py-2">${x.unit}</td>
                <td class="py-2 font-bold">${x.score}%</td>
                <td class="py-2 text-gray-500">${x.date}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <button onclick="location.reload()" class="mt-6 w-full py-3 bg-gray-200 rounded-3xl">返回</button>`;
    };

    window.onload = loadQuestions;
  </script>
</body>
</html>
